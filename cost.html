<!DOCTYPE html>
<html>
<head>
    <title>Adam Sales Computation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
<h2 class="text-primary mb-4">Adam sales computation</h2>


<form class="card p-4 shadow-sm">
    <label for="numberItems">Enter number items</label>
    <input type="number" class="form-control" id="numberItems" value="1"> <br>

    <label for="itemCost">Enter the cost of one item</label>
    <input type="number" class="form-control" id="itemCost" value="20.0"> <br>

    <label for="numberForDiscount">Enter number to get discount</label>
    <input type="number" class="form-control" id="numberForDiscount" value="10"> <br>

    <label for="discountRate">Enter the discount rate</label>
    <input type="number" class="form-control" id="discountRate" value="0.15"> <br>

    <input type="button" class="btn btn-primary mt-3" onclick="doDiscount()" value="Show costs">
</form>

<p id="result">Costs are:</p>

<form>
    <input type="radio" id="product" name="operation" value="mul"
      onclick="chooseOp()">
    <label for="product">product</label></br>

    <input type="radio" id="sum" name="operation" value="add"
      onclick="chooseOp()">
    <label for="sum">sum</label></br>

    <input type="radio" id="divide" name="operation" value="div"
      onclick="chooseOp()">
    <label for="divide">divide</label></br>
</form>

<p id="operationResult">Choose an operation</p>

<script> 

function doDiscount (){
    number = document.getElementById("numberItems").value
    cost = document.getElementById("itemCost").value
    discountRate = document.getElementById("discountRate").value
    discountAt = document.getElementById("numberForDiscount").value

    costs = ""

    for (checkCount = number; checkCount <= 5 * number; checkCount = checkCount + number) {

        if (checkCount < discountAt) {
            totalCost = checkCount * cost
        } else {
            totalCost = (discountAt * cost) + 
                        ((checkCount - discountAt) * cost * (1 - discountRate))
        }

        costs = costs + "checkCount " + checkCount + " is " + totalCost + "; "
    }

    document.getElementById("result").innerHTML = "Costs are:" + costs
}

function chooseOp (){
    count = document.getElementById("numberItems").value
    discountAt = document.getElementById("numberForDiscount").value

    productOpt = document.getElementById("product").checked
    sumOpt = document.getElementById("sum").checked
    divideOpt = document.getElementById("divide").checked

    out = document.getElementById("operationResult")

    if(productOpt){
        value = count * discountAt
        out.innerHTML = count + " times " + discountAt + " is " + value
    }

    if(sumOpt){
        value = Number(count) + Number(discountAt)
        out.innerHTML = count + " plus " + discountAt + " is " + value
    }

    if(divideOpt){
        value = count / discountAt
        out.innerHTML = count + " divided by " + discountAt + " is " + value
    }
}

</script>

</div>

</body>
</html>
