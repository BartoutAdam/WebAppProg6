<!DOCTYPE html>
<html>
<head>
    <title>Actors by Adam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
<h2 class="text-primary mb-4">Actor Guessing Game</h2>


<form>
    <label for="actor">Peter Pan</label>
    <input type="password" id="actor" value="Robin Williams">
    <br>

    <label for="guess">Who is the actor</label>
    <input type="text" id="guess">
    <br>

    <input type="button" class="btn btn-primary" onclick="checkActor()" value="Check the guess">
</form>

<div id="result" class="alert alert-info mt-3">
    Correct: 0 Not Correct: 0
</div>


<div>
    <img id="foodPic" src="Apples.jpg" width="150" height="150" onclick="updatePic()">
</div>

<script>

let correct = 0;
let notCorrect = 0;
let usePic = 1;

function checkActor() {
    let actor = document.getElementById("actor").value;
    let guess = document.getElementById("guess").value;

    if (actor == guess) {
        correct = correct + 1;
        alert("That's right");
    } else {
        notCorrect = notCorrect + 1;
        alert("Better luck next time");
    }

    document.getElementById("result").innerHTML =
        "Correct: " + correct + " Not Correct: " + notCorrect;

    if (notCorrect > 10) {
        document.querySelector('input[onclick="checkActor()"]').onclick = tooManyGuesses;
    }
}

function tooManyGuesses() {
    alert("Sorry, too many wrong guesses.");
}


function updatePic() {
    switch (usePic) {
        case 1:
            document.getElementById("foodPic").src = "Apples.jpg";
            usePic = 2;
            break;

        case 2:
            document.getElementById("foodPic").src = "Burgers.jpg";
            usePic = 3;
            break;

        case 3:
            document.getElementById("foodPic").src = "Tacos.jpg";
            usePic = 1;
            break;
    }
}

</script>
</div>
</body>
</html>
