<!DOCTYPE html>
<html>

<head>
    <title>Adam Meal Planner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-primary mb-4">Adam meal planner</h2>

<form>
    <input type="checkbox" id="breakfast" value="True">
    <label for="breakfast">Breakfast</label></br>

    <input type="checkbox" id="lunch" value="False">
    <label for="lunch">Lunch</label></br>

    <input type="checkbox" id="dinner" value="True">
    <label for="dinner">Dinner</label></br>

    <input type="button" onclick="choices()" value="Meal Plan Choices">
</form>

<p id="result">Meal plan choices will appear here</p>

<form>
    <label for="cuisine">Enter cuisine type</label>
    <input type="text" id="cuisine" value="Italian"> <br>

    <label for="beverage">Enter beverage choice</label>
    <input type="text" id="beverage" value="water"> <br>

    <input type="button" onclick="updateMeal()" value="Update the meal plan">
</form>

<script>

var my_meal_plan = {}

function choices() {
    my_meal_plan = {}

    my_meal_plan["breakfast"] = document.getElementById("breakfast").checked
    my_meal_plan["lunch"] = document.getElementById("lunch").checked
    my_meal_plan["dinner"] = document.getElementById("dinner").checked

    document.getElementById("result").innerHTML = JSON.stringify(my_meal_plan)
}

function updateMeal() {
    cuisine = document.getElementById("cuisine").value
    beverage = document.getElementById("beverage").value

    my_meal_plan["cuisine"] = cuisine
    my_meal_plan["beverage"] = beverage

    document.getElementById("result").innerHTML = JSON.stringify(my_meal_plan)
}

</script>

</div>

</body>
</html>
